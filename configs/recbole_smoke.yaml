# Framework verification on the bundled MovieLens example, NOT KuaiRand results.
model: BPR
dataset: ml-100k
seed: 42
reproducibility: true
use_gpu: true
gpu_id: '0'
worker: 0
epochs: 3
train_batch_size: 512
eval_batch_size: 4096
embedding_size: 32
learning_rate: 0.001
eval_step: 1
stopping_step: 3
show_progress: false
log_wandb: false
checkpoint_dir: experiments/recbole_smoke/checkpoints
eval_args:
  split:
    RS: [0.8, 0.1, 0.1]
  order: TO
  group_by: user
  mode: full
metrics: [Recall, NDCG, MRR]
topk: [10, 20]
valid_metric: NDCG@10
train_neg_sample_args:
  distribution: uniform
  sample_num: 1
  alpha: 1.0
  dynamic: false
  candidate_num: 0
